spring:
  application:
    name: inventory-service
  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    packages:
      trust-all: false
  jms:
    pub-sub-domain: true
    subscription-durable: true
    # This client id + the listener's subscription name together identify the subscription
    # ActiveMQ keeps around while this consumer is offline. A durable subscriber needs a real
    # (non-shared) Connection to set its client id, so caching is off.
    client-id: ${INVENTORY_JMS_CLIENT_ID:inventory-service}
    cache:
      enabled: false
    listener:
      session:
        transacted: true
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${INVENTORY_DB_USERNAME:inventory}
    password: ${INVENTORY_DB_PASSWORD:inventory}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (including the initial stock seed); Hibernate only verifies the
      # entities match it.
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

app:
  jms:
    redelivery:
      max-redeliveries: ${INVENTORY_JMS_MAX_REDELIVERIES:3}
      initial-delay: ${INVENTORY_JMS_INITIAL_REDELIVERY_DELAY:1s}
      back-off-multiplier: ${INVENTORY_JMS_REDELIVERY_BACKOFF_MULTIPLIER:2.0}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
