spring:
  application:
    name: inventory-service
  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    packages:
      trust-all: false
  jms:
    pub-sub-domain: true
    # Durable topic subscription: this client id + the listener's subscription name together
    # identify the subscription ActiveMQ keeps around while this consumer is offline. A durable
    # subscriber needs a real (non-shared) Connection to set its client id, so caching is off.
    client-id: ${INVENTORY_JMS_CLIENT_ID:inventory-service}
    cache:
      enabled: false
    listener:
      session:
        transacted: true
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    driver-class-name: org.h2.Driver
    username: ${INVENTORY_DB_USERNAME:sa}
    password: ${INVENTORY_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    # data.sql seeds stock; Hibernate must create the schema first since ddl-auto is used.
    defer-datasource-initialization: true
  mvc:
    problemdetails:
      enabled: true
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
