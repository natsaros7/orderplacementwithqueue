<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Place an order</title>
</head>
<body>
<main>
    <h1>Place an order</h1>

    <p th:if="${message}" role="status" th:text="${message}"></p>

    <form th:action="@{/orders}" th:object="${orderForm}" method="post" novalidate>
        <div>
            <label for="productCode">Product</label>
            <select id="productCode" th:field="*{productCode}">
                <option th:each="product : ${products}" th:value="${product}" th:text="${product}"></option>
            </select>
            <span th:if="${#fields.hasErrors('productCode')}" th:errors="*{productCode}" role="alert"></span>
        </div>

        <div>
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" th:field="*{quantity}" min="1"/>
            <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" role="alert"></span>
        </div>

        <button type="submit">Place order</button>
    </form>
</main>
</body>
</html>
