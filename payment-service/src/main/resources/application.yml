spring:
  application:
    name: payment-service
  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    packages:
      trust-all: false
  jms:
    pub-sub-domain: true
    subscription-durable: true
    # This client id + the listener's subscription name together identify the subscription
    # ActiveMQ keeps around while this consumer is offline. A durable subscriber needs a real
    # (non-shared) Connection to set its client id, so caching is off.
    client-id: ${PAYMENT_JMS_CLIENT_ID:payment-service}
    cache:
      enabled: false
    listener:
      session:
        transacted: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    driver-class-name: org.h2.Driver
    username: ${PAYMENT_DB_USERNAME:sa}
    password: ${PAYMENT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  mvc:
    problemdetails:
      enabled: true

app:
  jms:
    redelivery:
      max-redeliveries: ${PAYMENT_JMS_MAX_REDELIVERIES:3}
      initial-delay: ${PAYMENT_JMS_INITIAL_REDELIVERY_DELAY:1s}
      back-off-multiplier: ${PAYMENT_JMS_REDELIVERY_BACKOFF_MULTIPLIER:2.0}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
