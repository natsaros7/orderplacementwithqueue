services:
  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    volumes:
      # Postgres 18's image stores data in a major-version-specific subdirectory and expects the
      # volume mounted at the /var/lib/postgresql parent, not .../data directly (docker-library/postgres#1259).
      - postgres-data:/var/lib/postgresql
      # Database-per-service: creates the orders/inventory/payments databases and matching
      # roles on first boot; each service's own Flyway migrations then own their schema.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  activemq:
    image: apache/activemq-classic:6.2.0
    container_name: activemq
    ports:
      - "127.0.0.1:8161:8161" # Web console
      - "127.0.0.1:61616:61616" # JMS (OpenWire)
    environment:
      # Read by the image's own entrypoint.sh (not ACTIVEMQ_ADMIN_LOGIN/PASSWORD, which it ignores).
      ACTIVEMQ_CONNECTION_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_CONNECTION_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
      ACTIVEMQ_WEB_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_WEB_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    volumes:
      - activemq-data:/opt/apache-activemq/data
    healthcheck:
      # The web console requires auth on every path (even "/"), so probe the OpenWire port itself.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/61616' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      ACTIVEMQ_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/orders
      ORDER_DB_USERNAME: orders
      ORDER_DB_PASSWORD: orders
    depends_on:
      activemq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # temurin 25 JRE images ship no curl/wget: plain HTTP over bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "8081:8081"
    environment:
      ACTIVEMQ_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/inventory
      INVENTORY_DB_USERNAME: inventory
      INVENTORY_DB_PASSWORD: inventory
    depends_on:
      activemq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # temurin 25 JRE images ship no curl/wget: plain HTTP over bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8082:8082"
    environment:
      ACTIVEMQ_URL: tcp://activemq:61616
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payments
      PAYMENT_DB_USERNAME: payments
      PAYMENT_DB_PASSWORD: payments
    depends_on:
      activemq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # temurin 25 JRE images ship no curl/wget: plain HTTP over bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  activemq-data:
