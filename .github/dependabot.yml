version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /order-service
    schedule:
      interval: weekly
    # Java majors are deliberate LTS moves (java.version, .sdkmanrc, CI), not image bumps.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /inventory-service
    schedule:
      interval: weekly
    # Java majors are deliberate LTS moves (java.version, .sdkmanrc, CI), not image bumps.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /payment-service
    schedule:
      interval: weekly
    # Java majors are deliberate LTS moves (java.version, .sdkmanrc, CI), not image bumps.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
